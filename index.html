<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgriMind – AI Farm Advisor</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a1a0c;
    min-height: 100vh;
    color: #d4f5d4;
    overflow-x: hidden;
  }
  body.bn { font-family: 'Hind Siliguri', sans-serif; }
  #bg-pattern {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(34,88,34,0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(20,60,20,0.5) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, rgba(10,30,10,0.8) 0%, transparent 100%);
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,26,12,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(74,222,128,0.15);
  }
  .header-inner {
    max-width: 900px; margin: 0 auto;
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none; }
  .logo-icon { font-size: 28px; }
  .logo-title { font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 700; color: #4ade80; line-height: 1.1; }
  .logo-sub { font-size: 0.7rem; color: #6b9e6b; letter-spacing: 0.08em; text-transform: uppercase; }
  .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .crop-select {
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.3);
    border-radius: 8px; color: #a7f3c0;
    padding: 6px 10px; font-size: 0.82rem;
    outline: none; cursor: pointer;
    font-family: inherit;
  }
  .crop-select option { background: #1a2e1c; color: #d4f5d4; }
  .lang-toggle {
    display: flex; border: 1px solid rgba(74,222,128,0.3); border-radius: 8px; overflow: hidden;
  }
  .lang-btn {
    background: transparent; border: none; color: #6b9e6b;
    padding: 6px 12px; font-size: 0.8rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .lang-btn.active { background: rgba(74,222,128,0.2); color: #4ade80; }
  main {
    flex: 1; position: relative; z-index: 1;
    max-width: 900px; width: 100%; margin: 0 auto;
    padding: 0 16px;
    min-height: calc(100vh - 130px);
  }
  #home-view { padding-bottom: 20px; }
  .hero-section { text-align: center; padding: 48px 20px 32px; }
  .hero-emoji { font-size: 64px; display: block; margin-bottom: 16px; animation: float 4s ease-in-out infinite; }
  .hero-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 700; color: #86efac;
    margin-bottom: 12px; line-height: 1.2;
  }
  body.bn .hero-title { font-family: 'Hind Siliguri', sans-serif; }
  .hero-sub { font-size: 1rem; color: #6b9e6b; max-width: 480px; margin: 0 auto 20px; line-height: 1.7; }
  .hero-sub strong { color: #4ade80; }
  .photo-hero-cta {
    background: rgba(74,222,128,0.1);
    border: 2px dashed rgba(74,222,128,0.5);
    border-radius: 14px; color: #4ade80;
    padding: 12px 24px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer;
    font-family: inherit;
    transition: all 0.2s; display: inline-block; margin-top: 4px;
  }
  .photo-hero-cta:hover { background: rgba(74,222,128,0.2); transform: scale(1.04); }
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; padding: 0 8px 32px;
  }
  .quick-card {
    background: rgba(74,222,128,0.06);
    border: 1px solid rgba(74,222,128,0.2);
    border-radius: 14px; padding: 18px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; transition: all 0.25s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    color: #a7f3c0; font-family: inherit;
  }
  .quick-card:hover { transform: translateY(-4px); border-color: #4ade80; box-shadow: 0 12px 40px rgba(74,222,128,0.2); }
  .quick-icon { font-size: 28px; }
  .quick-label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; text-align: center; }
  .stats-row { display: flex; justify-content: center; gap: 16px; padding: 0 16px 16px; flex-wrap: wrap; }
  .stat-box { background: rgba(74,222,128,0.05); border: 1px solid rgba(74,222,128,0.1); border-radius: 14px; padding: 14px 20px; text-align: center; min-width: 90px; }
  .stat-icon { font-size: 22px; margin-bottom: 4px; }
  .stat-val { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 700; color: #4ade80; }
  .stat-label { font-size: 0.68rem; color: #6b9e6b; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

  .dev-credit {
    text-align: center;
    padding: 20px 16px 8px;
    position: relative; z-index: 1;
  }
  .dev-credit-inner {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(74,222,128,0.05);
    border: 1px solid rgba(74,222,128,0.12);
    border-radius: 20px;
    padding: 6px 16px;
  }
  .dev-credit-text {
    font-size: 0.72rem;
    color: #4d7a4d;
    letter-spacing: 0.04em;
  }
  .dev-credit-name {
    font-size: 0.75rem;
    font-weight: 600;
    color: #4ade80;
    letter-spacing: 0.05em;
  }
  .dev-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(74,222,128,0.3);
    flex-shrink: 0;
  }

  #chat-view { display: none; flex-direction: column; height: calc(100vh - 180px); }
  #chat-view.active { display: flex; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 4px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; scrollbar-color: #4ade80 transparent; }
  .message-wrap { display: flex; align-items: flex-end; gap: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.3); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .avatar-user { width: 32px; height: 32px; border-radius: 50%; background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .user-bubble { background: linear-gradient(135deg, #166534, #15803d); border-radius: 18px 18px 4px 18px; padding: 10px 14px; max-width: 75%; font-size: 0.9rem; line-height: 1.6; box-shadow: 0 4px 20px rgba(22,101,52,0.4); color: #dcfce7; }
  .ai-bubble { background: rgba(17,34,17,0.85); border: 1px solid rgba(74,222,128,0.15); border-radius: 18px 18px 18px 4px; padding: 12px 16px; max-width: 80%; font-size: 0.88rem; line-height: 1.7; backdrop-filter: blur(10px); box-shadow: 0 4px 24px rgba(0,0,0,0.3); color: #c4e8c4; }
  .msg-image { max-width: 100%; max-height: 220px; border-radius: 10px; object-fit: cover; display: block; border: 1px solid rgba(74,222,128,0.3); margin-bottom: 6px; }
  .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; animation: bounce 1.2s infinite; }
  .cursor { animation: blink 1s infinite; color: #4ade80; font-weight: 300; }
  .quick-strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; flex-shrink: 0; }
  .quick-strip::-webkit-scrollbar { display: none; }
  .strip-btn { background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2); border-radius: 20px; padding: 5px 12px; color: #86efac; font-size: 0.75rem; cursor: pointer; white-space: nowrap; font-family: inherit; transition: all 0.2s; }
  .strip-btn:hover { background: rgba(74,222,128,0.15); }
  footer { position: sticky; bottom: 0; background: rgba(10,26,12,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(74,222,128,0.1); padding: 10px 16px; z-index: 100; }
  .pending-image-bar { max-width: 900px; margin: 0 auto 8px; }
  .pending-image-inner { display: flex; align-items: center; gap: 10px; background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.3); border-radius: 12px; padding: 8px 10px; }
  .pending-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; border: 1px solid rgba(74,222,128,0.4); flex-shrink: 0; }
  .pending-info { flex: 1; min-width: 0; }
  .pending-name { display: block; font-size: 0.8rem; font-weight: 600; color: #86efac; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pending-hint { display: block; font-size: 0.7rem; color: #6b9e6b; margin-top: 2px; }
  .remove-img { background: rgba(255,100,100,0.15); border: 1px solid rgba(255,100,100,0.3); border-radius: 50%; color: #fca5a5; width: 24px; height: 24px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .input-row { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .img-btn { background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.25); border-radius: 12px; width: 44px; height: 44px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
  .img-btn.has-image { background: rgba(74,222,128,0.25); border-color: #4ade80; }
  textarea#chat-input { flex: 1; background: rgba(74,222,128,0.06); border: 1px solid rgba(74,222,128,0.25); border-radius: 14px; color: #d4f5d4; padding: 10px 14px; font-size: 0.9rem; font-family: inherit; outline: none; resize: none; line-height: 1.5; min-height: 44px; max-height: 120px; transition: border-color 0.2s; }
  textarea#chat-input:focus { border-color: rgba(74,222,128,0.5); }
  textarea#chat-input::placeholder { color: #3d6b3d; }
  textarea#chat-input::-webkit-scrollbar { width: 4px; }
  textarea#chat-input::-webkit-scrollbar-thumb { background: #4ade80; border-radius: 2px; }
  .send-btn { background: linear-gradient(135deg, #16a34a, #15803d); border: none; border-radius: 12px; color: #fff; width: 44px; height: 44px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 4px 16px rgba(22,163,74,0.4); flex-shrink: 0; cursor: pointer; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .send-btn:not(:disabled):hover { transform: scale(1.05); }
  .disclaimer { text-align: center; font-size: 0.68rem; color: #3d6b3d; margin: 6px auto 0; max-width: 900px; }
  .msg-heading { display: block; font-weight: 700; color: #86efac; margin: 10px 0 4px; font-size: 0.95em; }
  .msg-bullet { display: block; padding-left: 8px; margin: 3px 0; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } }

  /* ── Welcome Splash ── */
  #welcome-splash {
    position: fixed; inset: 0; z-index: 9999;
    background: #061008;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  #welcome-splash.hide {
    opacity: 0; transform: scale(1.04); pointer-events: none;
  }

  /* Particle field */
  .splash-particles {
    position: absolute; inset: 0; pointer-events: none;
  }
  .sp {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, #4ade80, transparent 70%);
    animation: sp-drift linear infinite;
    opacity: 0;
  }
  @keyframes sp-drift {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-110vh) scale(1.2); }
  }

  /* Ripple rings */
  .splash-rings {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(74,222,128,0.15);
    animation: ring-expand 3.5s ease-out infinite;
  }
  @keyframes ring-expand {
    0%   { width: 60px; height: 60px; opacity: 0.9; }
    100% { width: 600px; height: 600px; opacity: 0; }
  }

  /* Logo mark */
  .splash-logo-wrap {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }
  .splash-icon-circle {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(135deg at 30% 30%, #1a4d1a, #0a1a0c);
    border: 2px solid rgba(74,222,128,0.5);
    box-shadow: 0 0 40px rgba(74,222,128,0.3), inset 0 0 20px rgba(74,222,128,0.05);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    animation: splash-icon-in 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.2s both,
               splash-icon-pulse 2.5s ease-in-out 1.2s infinite;
    margin-bottom: 22px;
  }
  @keyframes splash-icon-in {
    from { transform: scale(0) rotate(-20deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);   opacity: 1; }
  }
  @keyframes splash-icon-pulse {
    0%,100% { box-shadow: 0 0 40px rgba(74,222,128,0.3), inset 0 0 20px rgba(74,222,128,0.05); }
    50%     { box-shadow: 0 0 70px rgba(74,222,128,0.5), inset 0 0 30px rgba(74,222,128,0.1); }
  }

  .splash-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    font-weight: 700;
    color: #86efac;
    letter-spacing: -0.02em;
    line-height: 1;
    opacity: 0;
    transform: translateY(18px);
    animation: splash-fade-up 0.7s ease 0.7s forwards;
  }
  .splash-tagline {
    font-size: clamp(0.8rem, 2.5vw, 1rem);
    color: #4d7a4d;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 6px;
    opacity: 0;
    transform: translateY(12px);
    animation: splash-fade-up 0.7s ease 0.95s forwards;
  }
  .splash-welcome-msg {
    margin-top: 32px;
    text-align: center;
    max-width: 340px;
    opacity: 0;
    transform: translateY(14px);
    animation: splash-fade-up 0.7s ease 1.25s forwards;
  }
  .splash-welcome-msg p {
    font-size: 1rem;
    color: #6b9e6b;
    line-height: 1.7;
  }
  .splash-welcome-msg strong {
    color: #4ade80;
    font-weight: 600;
  }

  /* Progress bar */
  .splash-progress-wrap {
    margin-top: 40px;
    width: 180px;
    opacity: 0;
    animation: splash-fade-up 0.5s ease 1.5s forwards;
  }
  .splash-progress-track {
    height: 3px;
    background: rgba(74,222,128,0.1);
    border-radius: 99px;
    overflow: hidden;
  }
  .splash-progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #16a34a, #4ade80);
    animation: progress-fill 1.8s cubic-bezier(0.4,0,0.2,1) 1.6s forwards;
    box-shadow: 0 0 8px rgba(74,222,128,0.6);
  }
  @keyframes progress-fill {
    0%   { width: 0%; }
    60%  { width: 75%; }
    100% { width: 100%; }
  }
  .splash-progress-label {
    text-align: center;
    margin-top: 10px;
    font-size: 0.72rem;
    color: #3d6b3d;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Floating leaf accents */
  .leaf-accent {
    position: absolute;
    font-size: 1.4rem;
    opacity: 0;
    animation: leaf-float linear infinite;
    pointer-events: none;
  }
  @keyframes leaf-float {
    0%   { opacity: 0; transform: translateY(20px) rotate(0deg); }
    15%  { opacity: 0.5; }
    85%  { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-80px) rotate(25deg); }
  }

  @keyframes splash-fade-up {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Enter button */
  .splash-enter-btn {
    margin-top: 28px;
    background: linear-gradient(135deg, #16a34a, #15803d);
    border: none; border-radius: 14px;
    color: #fff; font-family: inherit;
    font-size: 0.95rem; font-weight: 600;
    padding: 12px 32px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(22,163,74,0.4);
    opacity: 0;
    transform: translateY(10px);
    animation: splash-fade-up 0.6s ease 2s forwards;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.03em;
  }
  .splash-enter-btn:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 10px 32px rgba(22,163,74,0.55);
  }
  .splash-enter-btn .btn-icon { margin-right: 8px; }
</style>
</head>
<body>
<!-- ── Welcome Splash ── -->
<div id="welcome-splash">
  <div class="splash-rings">
    <div class="ring" style="animation-delay:0s"></div>
    <div class="ring" style="animation-delay:1.1s"></div>
    <div class="ring" style="animation-delay:2.2s"></div>
  </div>
  <div class="splash-particles" id="splash-particles"></div>
  <span class="leaf-accent" style="left:12%;bottom:20%;animation-duration:6s;animation-delay:1s;">🌿</span>
  <span class="leaf-accent" style="left:80%;bottom:25%;animation-duration:7s;animation-delay:2.2s;">🍃</span>
  <span class="leaf-accent" style="left:55%;bottom:10%;animation-duration:5.5s;animation-delay:0.5s;">🌱</span>
  <span class="leaf-accent" style="left:25%;bottom:8%;animation-duration:8s;animation-delay:1.8s;">🌾</span>
  <span class="leaf-accent" style="left:70%;bottom:15%;animation-duration:6.5s;animation-delay:3s;">🌿</span>
  <div class="splash-logo-wrap">
    <div class="splash-icon-circle">🌾</div>
    <div class="splash-title">AgriMind</div>
    <div class="splash-tagline" id="splash-tagline">AI Farm Advisor</div>
    <div class="splash-welcome-msg">
      <p id="splash-msg">Welcome! Your <strong>AI-powered agronomist</strong> is ready.<br>Ask anything — or upload a photo for instant diagnosis.</p>
    </div>
    <div class="splash-progress-wrap">
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div class="splash-progress-label" id="splash-loading-label">Loading knowledge base…</div>
    </div>
    <button class="splash-enter-btn" onclick="dismissSplash()" id="splash-enter-btn">
      <span class="btn-icon">🚜</span><span id="splash-btn-text">Start Farming Smarter</span>
    </button>
  </div>
</div>

<div id="bg-pattern"></div>

<header>
  <div class="header-inner">
    <div class="logo" onclick="showHome()">
      <span class="logo-icon">🌾</span>
      <div>
        <div class="logo-title">AgriMind</div>
        <div class="logo-sub" id="logo-sub"></div>
      </div>
    </div>
    <div class="header-controls">
      <select class="crop-select" id="crop-select"></select>
      <div class="lang-toggle">
        <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btn-bn" onclick="setLang('bn')">বাং</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div id="home-view">
    <div class="hero-section">
      <span class="hero-emoji">🌿</span>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-sub" id="hero-sub"></p>
      <button class="photo-hero-cta" onclick="document.getElementById('file-input').click()" id="photo-cta-btn"></button>
    </div>
    <div class="quick-grid" id="quick-grid"></div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-icon">🌍</div><div class="stat-val">50+</div><div class="stat-label" id="stat1"></div></div>
      <div class="stat-box"><div class="stat-icon">🔬</div><div class="stat-val">200+</div><div class="stat-label" id="stat2"></div></div>
      <div class="stat-box"><div class="stat-icon">📸</div><div class="stat-val" id="stat3val"></div><div class="stat-label" id="stat3"></div></div>
      <div class="stat-box"><div class="stat-icon">⚡</div><div class="stat-val" id="stat4val"></div><div class="stat-label" id="stat4"></div></div>
    </div>
    <div class="dev-credit">
      <div class="dev-credit-inner">
        <span class="dev-credit-text">Developed by</span>
        <div class="dev-dot"></div>
        <span class="dev-credit-name">DIPTO BISWAS</span>
      </div>
    </div>
  </div>

  <div id="chat-view">
    <div id="messages"></div>
    <div class="quick-strip" id="quick-strip"></div>
  </div>
</main>

<footer>

const GROQ_API_KEY = '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';

let lang = 'en';
let messages = [];
let loading = false;
let pendingImage = null;

function setLang(l) {
  lang = l;
  document.body.classList.toggle('bn', l === 'bn');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-bn').classList.toggle('active', l === 'bn');
  renderUI();
}

function renderUI() {
  const t = T[lang];
  document.getElementById('logo-sub').textContent = t.logoSub;
  document.getElementById('hero-title').textContent = t.heroTitle;
  document.getElementById('hero-sub').innerHTML = t.heroSub;
  document.getElementById('photo-cta-btn').textContent = t.photoCta;
  document.getElementById('stat1').textContent = t.stat1;
  document.getElementById('stat2').textContent = t.stat2;
  document.getElementById('stat3val').textContent = t.stat3val;
  document.getElementById('stat3').textContent = t.stat3;
  document.getElementById('stat4val').textContent = t.stat4val;
  document.getElementById('stat4').textContent = t.stat4;
  document.getElementById('disclaimer').textContent = t.disclaimer;
  document.getElementById('pending-hint').textContent = t.pendingHint;
  document.getElementById('chat-input').placeholder = pendingImage ? t.placeholderPhoto : t.placeholder;

  const sel = document.getElementById('crop-select');
  const prev = sel.value;
  sel.innerHTML = t.cropOptions.map((o,i) => `<option value="${i===0?'':o}">${o}</option>`).join('');
  sel.value = prev;

  const grid = document.getElementById('quick-grid');
  grid.innerHTML = t.cards.map(c =>
    `<button class="quick-card" onclick="sendMessage(${JSON.stringify(c.msg)})">
      <span class="quick-icon">${c.icon}</span>
      <span class="quick-label">${c.label}</span>
    </button>`
  ).join('');

  const strip = document.getElementById('quick-strip');
  strip.innerHTML = t.strips.map(s =>
    `<button class="strip-btn" onclick="sendMessage(${JSON.stringify(s.msg)})">${s.icon} ${s.label}</button>`
  ).join('');
}

function showHome() {
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('chat-view').classList.remove('active');
}
function showChat() {
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('chat-view').classList.add('active');
}

function handleImagePick(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const mediaType = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    const base64 = dataUrl.split(',')[1];
    pendingImage = { base64, mediaType, preview: dataUrl, name: file.name };
    document.getElementById('pending-thumb').src = dataUrl;
    document.getElementById('pending-name').textContent = '📸 ' + file.name;
    document.getElementById('pending-image-bar').style.display = 'block';
    document.getElementById('img-btn').classList.add('has-image');
    document.getElementById('chat-input').placeholder = T[lang].placeholderPhoto;
    updateSendBtn();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function removePendingImage() {
  pendingImage = null;
  document.getElementById('pending-image-bar').style.display = 'none';
  document.getElementById('img-btn').classList.remove('has-image');
  document.getElementById('chat-input').placeholder = T[lang].placeholder;
  updateSendBtn();
}

function updateSendBtn() {
  const input = document.getElementById('chat-input').value.trim();
  document.getElementById('send-btn').disabled = loading || (!input && !pendingImage);
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  updateSendBtn();
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function formatMsg(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/^#{1,3}\s(.+)$/gm, "<span class='msg-heading'>$1</span>")
    .replace(/^[-•]\s(.+)$/gm, "<span class='msg-bullet'>• $1</span>")
    .replace(/\n/g, '<br/>');
}

function appendMessage(role, content, imageData) {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'message-wrap';
  wrap.style.justifyContent = role === 'user' ? 'flex-end' : 'flex-start';

  if (role === 'assistant') {
    const av = document.createElement('div');
    av.className = 'avatar'; av.textContent = '🌾';
    wrap.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = role === 'user' ? 'user-bubble' : 'ai-bubble';

  if (role === 'user') {
    if (imageData) {
      const img = document.createElement('img');
      img.src = imageData.preview; img.className = 'msg-image';
      bubble.appendChild(img);
    }
    if (content) {
      const t = document.createElement('div'); t.textContent = content;
      bubble.appendChild(t);
    }
  } else {
    bubble.innerHTML = formatMsg(content);
  }

  wrap.appendChild(bubble);

  if (role === 'user') {
    const av = document.createElement('div');
    av.className = 'avatar-user'; av.textContent = '👤';
    wrap.appendChild(av);
  }

  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
  return bubble;
}

function appendTypingIndicator() {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'message-wrap'; wrap.id = 'typing-indicator';
  wrap.style.justifyContent = 'flex-start';
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = '🌾';
  wrap.appendChild(av);
  const bubble = document.createElement('div');
  bubble.className = 'ai-bubble';
  bubble.innerHTML = `<div class="typing-dots">
    <span class="dot" style="animation-delay:0s"></span>
    <span class="dot" style="animation-delay:0.2s"></span>
    <span class="dot" style="animation-delay:0.4s"></span>
  </div>`;
  wrap.appendChild(bubble);
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function buildApiHistory() {
  return messages.map(m => {
    if (m.role === 'user' && m.image) {
      return {
        role: 'user',
        content: [
          { type: 'text', text: m.content || (lang === 'bn' ? 'এই ফসলের ছবিটি বিশ্লেষণ করুন।' : 'Please analyze this image of my crop.') },
          { type: 'image_url', image_url: { url: `data:${m.image.mediaType};base64,${m.image.base64}` } }
        ]
      };
    }
    return { role: m.role, content: m.content };
  });
}

async function callAI(userMessage, image) {
  const crop = document.getElementById('crop-select').value;
  const cropNote = crop ? (lang === 'bn' ? `[কৃষকের প্রধান ফসল: ${crop}]\n\n` : `[Farmer's primary crop: ${crop}]\n\n`) : '';
  const fallbackMsg = image
    ? (lang === 'bn' ? 'এই ফসলের ছবিটি বিশ্লেষণ করুন — কোনো রোগ, পোকা বা সমস্যা আছে কিনা বলুন।' : 'Please analyze this image of my crop and tell me what you see.')
    : '';
  const text = cropNote + (userMessage || fallbackMsg);

  const history = buildApiHistory();
  const lastMsg = history[history.length - 1];
  if (image) {
    lastMsg.content = [
      { type: 'text', text },
      { type: 'image_url', image_url: { url: `data:${image.mediaType};base64,${image.base64}` } }
    ];
  } else {
    lastMsg.content = text;
  }

  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${GROQ_API_KEY}`
    },
    body: JSON.stringify({
      model: image ? 'meta-llama/llama-4-scout-17b-16e-instruct' : 'llama-3.3-70b-versatile',
      max_tokens: 1000,
      messages: [
        { role: 'system', content: T[lang].systemPrompt },
        ...history
      ]
    })
  });

  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    throw new Error(errData?.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  return data.choices?.[0]?.message?.content || (lang === 'bn' ? 'দুঃখিত, উত্তর পাওয়া যায়নি।' : 'Sorry, I could not get a response.');
}

async function sendMessage(textOverride) {
  const inputEl = document.getElementById('chat-input');
  const msg = (textOverride !== undefined ? textOverride : inputEl.value).trim();
  const image = pendingImage;

  if (!msg && !image) return;
  if (loading) return;

  loading = true;
  inputEl.value = '';
  inputEl.style.height = '';
  removePendingImage();
  updateSendBtn();
  showChat();

  const userEntry = { role: 'user', content: msg || '', image: image || null };
  messages.push(userEntry);
  appendMessage('user', msg, image);
  appendTypingIndicator();

  try {
    const reply = await callAI(msg, image);
    removeTypingIndicator();
    messages.push({ role: 'assistant', content: reply });

    const container = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'message-wrap';
    wrap.style.justifyContent = 'flex-start';
    const av = document.createElement('div');
    av.className = 'avatar'; av.textContent = '🌾';
    wrap.appendChild(av);
    const bubble = document.createElement('div');
    bubble.className = 'ai-bubble';
    wrap.appendChild(bubble);
    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;

    let i = 0;
    const interval = setInterval(() => {
      i++;
      bubble.innerHTML = formatMsg(reply.slice(0, i)) + '<span class="cursor">|</span>';
      container.scrollTop = container.scrollHeight;
      if (i >= reply.length) {
        clearInterval(interval);
        bubble.innerHTML = formatMsg(reply);
        container.scrollTop = container.scrollHeight;
        loading = false;
        updateSendBtn();
      }
    }, 8);

  } catch (err) {
    removeTypingIndicator();
    messages.pop();
    appendMessage('assistant', `⚠️ ${T[lang].errorMsg}`);
    loading = false;
    updateSendBtn();
  }
}

document.getElementById('chat-input').addEventListener('input', updateSendBtn);
