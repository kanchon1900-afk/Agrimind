<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AgriMind – AI Farm Advisor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --accent:#4ade80; --accent-dim:rgba(74,222,128,0.18); --accent-glow:rgba(74,222,128,0.45);
  --accent-text:#86efac; --text:#d4f5d4; --text-dim:#7aaa7a; --text-muted:#4a784a; --bg:#060f08;
  --g1:rgba(255,255,255,0.04); --g2:rgba(255,255,255,0.07); --gb:rgba(255,255,255,0.12);
  --gs:rgba(255,255,255,0.22); --gshadow:0 8px 40px rgba(0,0,0,0.5),0 1px 0 rgba(255,255,255,0.1) inset,0 -1px 0 rgba(0,0,0,0.2) inset;
  --spring:cubic-bezier(0.34,1.56,0.64,1); --spring-soft:cubic-bezier(0.25,1.1,0.5,1.05); --ease-out:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;cursor:none;}
body.bn{font-family:'Hind Siliguri',sans-serif;}

/* ── CUSTOM CURSOR ───────────────────────────────────────────────── */
#cursor-dot{position:fixed;top:0;left:0;width:8px;height:8px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width 0.2s,height 0.2s,opacity 0.2s;box-shadow:0 0 12px var(--accent),0 0 24px rgba(74,222,128,0.4);}
#cursor-ring{position:fixed;top:0;left:0;width:32px;height:32px;border:1.5px solid rgba(74,222,128,0.5);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:transform 0.12s var(--ease-out),width 0.25s,height 0.25s,border-color 0.2s,opacity 0.2s;backdrop-filter:blur(2px);}
#cursor-trail-canvas{position:fixed;inset:0;pointer-events:none;z-index:99990;}
body:has(button:hover) #cursor-dot,body:has(a:hover) #cursor-dot{width:14px;height:14px;background:rgba(74,222,128,0.5);}
body:has(button:hover) #cursor-ring,body:has(a:hover) #cursor-ring{width:48px;height:48px;border-color:rgba(74,222,128,0.8);}

/* ── MORPHING BLOB BG ────────────────────────────────────────────── */
#blob-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.7;}

/* ── SCAN LINE ───────────────────────────────────────────────────── */
.scan{position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(74,222,128,0.006) 2px,rgba(74,222,128,0.006) 4px);animation:scan-drift 30s linear infinite;}
@keyframes scan-drift{0%{background-position:0 0;}100%{background-position:0 400px;}}

/* ── PARTICLE CANVAS ─────────────────────────────────────────────── */
#particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── LIQUID GLASS ────────────────────────────────────────────────── */
.lg{background:var(--g1);backdrop-filter:blur(32px) saturate(1.9) brightness(1.1);-webkit-backdrop-filter:blur(32px) saturate(1.9) brightness(1.1);border:1px solid var(--gb);box-shadow:var(--gshadow);position:relative;}
.lg::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gs) 40%,rgba(255,255,255,0.38) 50%,var(--gs) 60%,transparent);border-radius:inherit;pointer-events:none;z-index:1;}
.lg::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(74,222,128,0.1),transparent);border-radius:inherit;pointer-events:none;}

/* Ripple on click */
.ripple-host{position:relative;overflow:hidden;}
.ripple{position:absolute;border-radius:50%;background:rgba(74,222,128,0.25);transform:scale(0);animation:ripple-out 0.6s var(--ease-out) forwards;pointer-events:none;}
@keyframes ripple-out{to{transform:scale(4);opacity:0;}}

/* ── HEADER ──────────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:100;background:rgba(6,16,9,0.55);backdrop-filter:blur(36px) saturate(2);-webkit-backdrop-filter:blur(36px) saturate(2);border-bottom:1px solid rgba(255,255,255,0.08);box-shadow:0 1px 0 rgba(255,255,255,0.06),0 4px 24px rgba(0,0,0,0.4);animation:header-in 0.6s var(--ease-out) both;}
@keyframes header-in{from{transform:translateY(-100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
.header-inner{max-width:900px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:10px;cursor:none;text-decoration:none;}
.logo-icon{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,rgba(74,222,128,0.22),rgba(22,101,52,0.32),rgba(3,10,5,0.5));border:1px solid rgba(74,222,128,0.25);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 14px rgba(74,222,128,0.15),0 1px 0 rgba(255,255,255,0.18) inset;transition:transform 0.4s var(--spring),box-shadow 0.3s;position:relative;overflow:hidden;}
.logo-icon::before{content:'';position:absolute;top:2px;left:8px;width:16px;height:8px;background:radial-gradient(ellipse,rgba(255,255,255,0.3),transparent 70%);border-radius:50%;transform:rotate(-10deg);}
.logo:hover .logo-icon{transform:scale(1.14) rotate(-7deg);box-shadow:0 8px 28px rgba(74,222,128,0.35),0 1px 0 rgba(255,255,255,0.24) inset;}
.logo-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--accent-text);line-height:1.1;}
.logo-sub{font-size:0.62rem;color:var(--text-muted);letter-spacing:0.12em;text-transform:uppercase;}
.crop-select{background:var(--g1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:var(--accent-text);padding:7px 12px;font-size:0.8rem;font-family:inherit;outline:none;cursor:none;transition:border-color 0.2s,background 0.2s,box-shadow 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.25),0 1px 0 rgba(255,255,255,0.06) inset;}
.crop-select:hover,.crop-select:focus{background:rgba(255,255,255,0.08);border-color:rgba(74,222,128,0.35);box-shadow:0 0 0 3px rgba(74,222,128,0.07),0 2px 8px rgba(0,0,0,0.25);}
.crop-select option{background:#0e1f11;color:var(--text);}
.lang-toggle{display:flex;border:1px solid rgba(255,255,255,0.1);border-radius:12px;overflow:hidden;background:var(--g1);backdrop-filter:blur(12px);}
.lang-btn{background:transparent;border:none;color:var(--text-muted);padding:6px 16px;font-size:0.78rem;font-weight:600;cursor:none;font-family:inherit;transition:all 0.28s var(--spring-soft);position:relative;}
.lang-btn.active{background:rgba(74,222,128,0.2);color:var(--accent);}

/* ── MAIN ────────────────────────────────────────────────────────── */
main{position:relative;z-index:1;max-width:900px;width:100%;margin:0 auto;padding:0 16px;}
#home-view{padding-bottom:24px;}

/* ── HERO ────────────────────────────────────────────────────────── */
.hero-section{text-align:center;padding:56px 20px 40px;}

/* Split-text letter animation */
.split-text .char{display:inline-block;opacity:0;transform:translateY(40px) rotateX(40deg);animation:char-in 0.6s var(--spring) forwards;}
@keyframes char-in{to{opacity:1;transform:translateY(0) rotateX(0deg);}}

/* Staggered sub */
.hero-sub{font-size:1rem;color:var(--text-dim);max-width:460px;margin:0 auto 28px;line-height:1.8;font-weight:300;opacity:0;animation:fade-up 0.7s var(--ease-out) 0.9s forwards;}
.hero-sub strong{color:var(--accent);font-weight:500;}
@keyframes fade-up{to{opacity:1;transform:translateY(0);}}

/* ── HERO ORB — 3D TILT + GLOW ───────────────────────────────────── */
.hero-orb-ring{display:inline-flex;align-items:center;justify-content:center;position:relative;margin-bottom:32px;perspective:600px;}
.hero-orb-ring::before{content:'';position:absolute;width:134px;height:134px;border-radius:40px;border:1px solid rgba(74,222,128,0.13);animation:ring-pulse 3.2s ease-in-out infinite;}
.hero-orb-ring::after{content:'';position:absolute;width:158px;height:158px;border-radius:46px;border:1px solid rgba(74,222,128,0.06);animation:ring-pulse 3.2s ease-in-out infinite 0.6s;}
@keyframes ring-pulse{0%,100%{opacity:0.8;transform:scale(1);}50%{opacity:0.25;transform:scale(1.08);}}

.hero-orb{width:104px;height:104px;border-radius:34px;background:linear-gradient(145deg,rgba(74,222,128,0.2),rgba(34,197,94,0.1) 30%,rgba(22,101,52,0.24) 65%,rgba(4,12,6,0.48));border:1px solid rgba(255,255,255,0.2);box-shadow:0 28px 80px rgba(74,222,128,0.2),0 4px 18px rgba(0,0,0,0.45),0 1px 0 rgba(255,255,255,0.3) inset,0 -1px 0 rgba(0,0,0,0.28) inset,inset 2px 0 rgba(255,255,255,0.05),inset -2px 0 rgba(0,0,0,0.07);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;font-size:46px;position:relative;overflow:hidden;animation:orb-float 5.5s ease-in-out infinite,orb-in 0.9s var(--spring) 0.3s both;transform-style:preserve-3d;will-change:transform;}
.hero-orb::before{content:'';position:absolute;top:6px;left:14px;width:46px;height:21px;background:radial-gradient(ellipse,rgba(255,255,255,0.3),transparent 70%);border-radius:50%;transform:rotate(-18deg);}
.hero-orb::after{content:'';position:absolute;bottom:8px;right:12px;width:30px;height:14px;background:radial-gradient(ellipse,rgba(74,222,128,0.18),transparent 70%);border-radius:50%;}
@keyframes orb-float{0%,100%{transform:translateY(0) rotate(0deg);}33%{transform:translateY(-15px) rotate(3.5deg);}66%{transform:translateY(-7px) rotate(-2.5deg);}}
@keyframes orb-in{from{transform:scale(0.35) rotate(-18deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}

/* Glow halo that breathes */
.orb-glow{position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(74,222,128,0.18),transparent 70%);filter:blur(20px);animation:glow-pulse 3s ease-in-out infinite;pointer-events:none;}
@keyframes glow-pulse{0%,100%{transform:scale(1);opacity:0.7;}50%{transform:scale(1.3);opacity:1;}}

.hero-title{font-family:'Playfair Display',serif;font-size:clamp(2.1rem,5.5vw,3.1rem);font-weight:800;color:var(--accent-text);margin-bottom:16px;line-height:1.12;letter-spacing:-0.025em;perspective:800px;}
body.bn .hero-title{font-family:'Hind Siliguri',sans-serif;}

/* CTA pill */
.photo-cta{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(145deg,rgba(74,222,128,0.14),rgba(22,163,74,0.1));border:1.5px solid rgba(74,222,128,0.38);border-radius:50px;color:var(--accent);padding:13px 30px;font-size:0.92rem;font-weight:600;cursor:none;font-family:inherit;backdrop-filter:blur(16px);box-shadow:0 6px 28px rgba(74,222,128,0.14),0 1px 0 rgba(255,255,255,0.14) inset;transition:all 0.35s var(--spring);position:relative;overflow:hidden;opacity:0;animation:fade-up 0.7s var(--ease-out) 1.1s forwards;}
.photo-cta::before{content:'';position:absolute;top:0;left:-120%;width:70%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);transition:left 0.55s var(--ease-out);}
.photo-cta:hover{transform:scale(1.06) translateY(-3px);box-shadow:0 14px 44px rgba(74,222,128,0.3),0 1px 0 rgba(255,255,255,0.18) inset;border-color:rgba(74,222,128,0.7);}
.photo-cta:hover::before{left:150%;}
.photo-cta:active{transform:scale(0.97);}

/* ── QUICK CARDS — 3D TILT ───────────────────────────────────────── */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px;padding:0 2px 36px;}
.quick-card{background:var(--g1);border:1px solid rgba(255,255,255,0.09);border-radius:22px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:none;font-family:inherit;color:var(--accent-text);backdrop-filter:blur(16px);box-shadow:0 4px 20px rgba(0,0,0,0.3),0 1px 0 rgba(255,255,255,0.08) inset;transition:box-shadow 0.3s,border-color 0.25s,background 0.25s;position:relative;overflow:hidden;opacity:0;animation:card-in var(--spring) forwards;transform-style:preserve-3d;will-change:transform;}
.quick-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);}
.quick-card::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,0.06),transparent);transition:left 0.5s var(--ease-out);pointer-events:none;}
.quick-card:hover::after{left:130%;}
.quick-card:nth-child(1){animation-delay:0.5s;}.quick-card:nth-child(2){animation-delay:0.62s;}.quick-card:nth-child(3){animation-delay:0.74s;}.quick-card:nth-child(4){animation-delay:0.86s;}.quick-card:nth-child(5){animation-delay:0.98s;}.quick-card:nth-child(6){animation-delay:1.1s;}
@keyframes card-in{from{opacity:0;transform:translateY(30px) scale(0.9);}to{opacity:1;transform:translateY(0) scale(1);}}
.quick-card:active{transform:scale(0.96)!important;}
.quick-icon{font-size:28px;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35));transition:transform 0.35s var(--spring);}
.quick-card:hover .quick-icon{transform:scale(1.25) rotate(7deg);}
.quick-label{font-size:0.76rem;font-weight:600;letter-spacing:0.02em;text-align:center;opacity:0.9;}

/* ── STATS ───────────────────────────────────────────────────────── */
.stats-row{display:flex;justify-content:center;gap:11px;padding:0 2px 28px;flex-wrap:wrap;}
.stat-box{background:var(--g1);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:18px 22px;text-align:center;min-width:92px;backdrop-filter:blur(16px);box-shadow:0 4px 20px rgba(0,0,0,0.22),0 1px 0 rgba(255,255,255,0.07) inset;opacity:0;animation:stat-in var(--spring) forwards;transition:transform 0.3s var(--spring),box-shadow 0.3s;position:relative;overflow:hidden;}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);}
.stat-box:hover{transform:translateY(-5px);box-shadow:0 16px 44px rgba(0,0,0,0.38),0 0 0 1px rgba(74,222,128,0.12),0 1px 0 rgba(255,255,255,0.12) inset;}
.stat-box:nth-child(1){animation-delay:1.05s;}.stat-box:nth-child(2){animation-delay:1.18s;}.stat-box:nth-child(3){animation-delay:1.31s;}.stat-box:nth-child(4){animation-delay:1.44s;}
@keyframes stat-in{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.stat-icon{font-size:22px;margin-bottom:6px;}
.stat-val{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--accent);}
/* Count-up number */
.stat-val[data-target]{display:inline-block;}
.stat-label{font-size:0.63rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.09em;margin-top:3px;}

/* ── DEV CREDIT ──────────────────────────────────────────────────── */
.dev-credit{text-align:center;padding:18px 16px 12px;position:relative;z-index:1;}
.dev-credit-inner{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(74,222,128,0.07),rgba(22,101,52,0.1));border:1px solid rgba(74,222,128,0.22);border-radius:22px;padding:9px 22px;backdrop-filter:blur(16px);box-shadow:0 4px 24px rgba(74,222,128,0.07),0 1px 0 rgba(255,255,255,0.08) inset;transition:transform 0.3s var(--spring),box-shadow 0.3s;}
.dev-credit-inner:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(74,222,128,0.16),0 1px 0 rgba(255,255,255,0.1) inset;}
.dev-credit-text{font-size:0.68rem;color:var(--text-muted);letter-spacing:0.06em;}
.dev-credit-name{font-family:'Playfair Display',serif;font-size:0.88rem;font-weight:700;background:linear-gradient(135deg,#4ade80,#86efac,#22c55e,#86efac,#4ade80);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:0.1em;animation:shimmer 3.5s linear infinite;}
@keyframes shimmer{0%{background-position:0% center;}100%{background-position:300% center;}}
.dev-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex-shrink:0;animation:dot-pulse 2s ease-in-out infinite;}
@keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.45;transform:scale(0.7);}}

/* ── CHAT VIEW ───────────────────────────────────────────────────── */
#chat-view{display:none;flex-direction:column;height:calc(100vh - 175px);}
#chat-view.active{display:flex;}
#messages{flex:1;overflow-y:auto;padding:20px 4px;display:flex;flex-direction:column;gap:15px;scrollbar-width:thin;scrollbar-color:rgba(74,222,128,0.25) transparent;}
#messages::-webkit-scrollbar{width:3px;}
#messages::-webkit-scrollbar-thumb{background:rgba(74,222,128,0.22);border-radius:2px;}
.message-wrap{display:flex;align-items:flex-end;gap:9px;}
.user-wrap{animation:msg-right 0.5s var(--spring) both;}
.ai-wrap{animation:msg-left 0.5s var(--spring) both;}
@keyframes msg-right{from{opacity:0;transform:translateX(28px) scale(0.92);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes msg-left{from{opacity:0;transform:translateX(-28px) scale(0.92);}to{opacity:1;transform:translateX(0) scale(1);}}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,rgba(74,222,128,0.18),rgba(22,101,52,0.28));border:1px solid rgba(74,222,128,0.28);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,0.35),0 1px 0 rgba(255,255,255,0.12) inset;}
.avatar-user{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.user-bubble{background:linear-gradient(160deg,#166534,#14532d 70%,#0f3d22);border-radius:20px 20px 6px 20px;padding:11px 16px;max-width:76%;font-size:0.88rem;line-height:1.68;color:#dcfce7;box-shadow:0 6px 24px rgba(22,101,52,0.5),0 1px 0 rgba(255,255,255,0.12) inset;position:relative;overflow:hidden;}
.user-bubble::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent);}
.ai-bubble{background:rgba(14,30,17,0.72);border:1px solid rgba(255,255,255,0.09);border-radius:20px 20px 20px 6px;padding:13px 17px;max-width:80%;font-size:0.87rem;line-height:1.75;backdrop-filter:blur(24px);box-shadow:0 6px 28px rgba(0,0,0,0.4),0 1px 0 rgba(255,255,255,0.08) inset;color:#c4e8c4;position:relative;overflow:hidden;}
.ai-bubble::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.13),transparent);}
.msg-image{max-width:100%;max-height:230px;border-radius:15px;object-fit:cover;display:block;border:1px solid rgba(255,255,255,0.1);margin-bottom:7px;box-shadow:0 6px 20px rgba(0,0,0,0.45);}
.typing-dots{display:flex;gap:5px;align-items:center;height:22px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dot-bounce 1.4s ease-in-out infinite;box-shadow:0 0 7px rgba(74,222,128,0.55);}
@keyframes dot-bounce{0%,60%,100%{transform:translateY(0) scale(1);opacity:0.55;}30%{transform:translateY(-9px) scale(1.18);opacity:1;}}
.dot:nth-child(2){animation-delay:0.16s;}.dot:nth-child(3){animation-delay:0.32s;}
.cursor-blink{animation:blink 0.9s ease-in-out infinite;color:var(--accent);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ── QUICK STRIP ─────────────────────────────────────────────────── */
.quick-strip{display:flex;gap:8px;overflow-x:auto;padding:9px 0 5px;scrollbar-width:none;flex-shrink:0;}
.quick-strip::-webkit-scrollbar{display:none;}
.strip-btn{background:var(--g1);border:1px solid rgba(255,255,255,0.1);border-radius:50px;padding:7px 16px;color:var(--accent-text);font-size:0.74rem;cursor:none;white-space:nowrap;font-family:inherit;backdrop-filter:blur(12px);box-shadow:0 2px 8px rgba(0,0,0,0.22),0 1px 0 rgba(255,255,255,0.07) inset;transition:all 0.28s var(--spring-soft);}
.strip-btn:hover{background:rgba(74,222,128,0.12);border-color:rgba(74,222,128,0.3);transform:scale(1.07) translateY(-2px);box-shadow:0 8px 20px rgba(74,222,128,0.14);}
.strip-btn:active{transform:scale(0.95);}

/* ── FOOTER ──────────────────────────────────────────────────────── */

<script>
/* ═══════════════════════════════════════════════════════════════════
   ANIMATION ENGINE
═══════════════════════════════════════════════════════════════════ */

/* ── 1. MAGNETIC CURSOR + TRAIL ─────────────────────────────────── */
(function initCursor(){
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  const canvas = document.getElementById('cursor-trail-canvas');
  const ctx = canvas.getContext('2d');

  let mx=0,my=0, rx=0,ry=0;
  const trail = [];
  const MAX_TRAIL = 28;

  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);

  document.addEventListener('mousemove',e=>{
    mx=e.clientX; my=e.clientY;
    dot.style.left=mx+'px'; dot.style.top=my+'px';
    trail.push({x:mx,y:my,a:1,r:4});
    if(trail.length>MAX_TRAIL) trail.shift();
  });

  /* Spring-follow ring */
  (function animRing(){
    rx += (mx-rx)*0.12; ry += (my-ry)*0.12;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';

    /* Draw trail */
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<trail.length;i++){
      const t=trail[i]; const p=i/trail.length;
      t.a=p*0.55; t.r=1+p*3.5;
      ctx.beginPath();
      ctx.arc(t.x,t.y,t.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(74,222,128,${t.a})`;
      ctx.fill();
    }
    requestAnimationFrame(animRing);
  })();
})();

/* ── 2. MORPHING BLOB BACKGROUND ────────────────────────────────── */
(function initBlob(){
  const canvas = document.getElementById('blob-canvas');
  const ctx = canvas.getContext('2d');
  let W,H,t=0;

  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);

  function blobPoint(cx,cy,r,angle,wobble,phase){
    const w = r + Math.sin(angle*wobble+t*0.6+phase)*r*0.22
              + Math.cos(angle*wobble*1.3+t*0.4)*r*0.12;
    return{ x: cx + Math.cos(angle)*w, y: cy + Math.sin(angle)*w };
  }

  function drawBlob(cx,cy,r,wobble,phase,col1,col2){
    const pts=32; const step=Math.PI*2/pts;
    ctx.beginPath();
    for(let i=0;i<=pts;i++){
      const a=i*step;
      const p=blobPoint(cx,cy,r,a,wobble,phase);
      i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);
    }
    ctx.closePath();
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,col1); g.addColorStop(1,col2);
    ctx.fillStyle=g; ctx.fill();
  }

  (function anim(){
    t+=0.008;
    ctx.clearRect(0,0,W,H);
    drawBlob(W*0.22,H*0.25,Math.min(W,H)*0.38,3,0,'rgba(20,83,45,0.38)','transparent');
    drawBlob(W*0.78,H*0.72,Math.min(W,H)*0.32,4,2.1,'rgba(10,45,25,0.3)','transparent');
    drawBlob(W*0.5,H*0.5,Math.min(W,H)*0.22,5,4.3,'rgba(74,222,128,0.045)','transparent');
    requestAnimationFrame(anim);
  })();
})();

/* ── 3. FLOATING PARTICLE FIELD ─────────────────────────────────── */
(function initParticles(){
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let W,H;

  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);

  const N=60;
  const particles=Array.from({length:N},()=>({
    x:Math.random()*W, y:Math.random()*H,
    vx:(Math.random()-0.5)*0.25, vy:-0.15-Math.random()*0.3,
    r:0.8+Math.random()*2.2,
    a:Math.random()*0.35+0.05,
    life:Math.random(),
    maxLife:1
  }));

  (function anim(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.life-=0.003;
      if(p.life<=0||p.y<-10){
        p.x=Math.random()*W; p.y=H+10; p.life=1;
        p.vx=(Math.random()-0.5)*0.25; p.vy=-0.15-Math.random()*0.3;
      }
      const alpha = p.a * Math.sin(p.life*Math.PI);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(74,222,128,${alpha})`; ctx.fill();
    });
    requestAnimationFrame(anim);
  })();
})();

/* ── 4. HERO ORB 3D TILT ────────────────────────────────────────── */
(function initOrbTilt(){
  const orb=document.getElementById('hero-orb');
  if(!orb) return;
  const wrap=orb.closest('.hero-orb-ring');
  wrap.addEventListener('mousemove',e=>{
    const r=orb.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=(e.clientX-cx)/60, dy=(e.clientY-cy)/60;
    orb.style.transform=`translateY(${-12*Math.sin(Date.now()/2000)}px) rotateY(${dx*12}deg) rotateX(${-dy*12}deg) scale(1.06)`;
  });
  wrap.addEventListener('mouseleave',()=>{ orb.style.transform=''; });
})();

/* ── 5. CARD 3D TILT ────────────────────────────────────────────── */
function initCardTilts(){
  document.querySelectorAll('.quick-card').forEach(card=>{
    card.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const dx=(e.clientX-cx)/r.width, dy=(e.clientY-cy)/r.height;
      card.style.transform=`translateY(-8px) scale(1.04) rotateY(${dx*14}deg) rotateX(${-dy*14}deg)`;
      card.style.boxShadow=`${-dx*12}px ${-dy*12+20}px 56px rgba(0,0,0,0.48),0 0 0 1px rgba(74,222,128,0.18),0 1px 0 rgba(255,255,255,0.14) inset`;
    });
    card.addEventListener('mouseleave',()=>{
      card.style.transform=''; card.style.boxShadow='';
    });
  });
}

/* ── 6. RIPPLE ON CLICK ─────────────────────────────────────────── */
document.addEventListener('click',e=>{
  const host=e.target.closest('.ripple-host');
  if(!host) return;
  const r=host.getBoundingClientRect();
  const size=Math.max(r.width,r.height)*2;
  const ripple=document.createElement('span');
  ripple.className='ripple';
  ripple.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px;`;
  host.appendChild(ripple);
  setTimeout(()=>ripple.remove(),700);
});

/* ── 7. SPLIT-TEXT HERO TITLE ───────────────────────────────────── */
function splitTextAnimate(el){
  const text=el.textContent;
  el.innerHTML='';
  el.classList.add('split-text');
  [...text].forEach((ch,i)=>{
    const span=document.createElement('span');
    span.className='char';
    span.textContent=ch===' '?'\u00a0':ch;
    span.style.animationDelay=(0.5+i*0.045)+'s';
    el.appendChild(span);
  });
}

/* ── 8. SCROLL REVEAL ───────────────────────────────────────────── */
function initScrollReveal(){
  const obs=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        en.target.style.opacity='1';
        en.target.style.transform='translateY(0)';
      }
    });
  },{threshold:0.15});
  document.querySelectorAll('.stat-box,.dev-credit-inner').forEach(el=>{
    obs.observe(el);
  });
}

/* ── 9. SPLASH CANVAS PARTICLES ─────────────────────────────────── */
(function initSplashParticles(){
  const canvas=document.getElementById('splash-particle-canvas');
  const ctx=canvas.getContext('2d');
  let W,H;
  function resize(){ W=canvas.width=canvas.parentElement.offsetWidth||window.innerWidth; H=canvas.height=canvas.parentElement.offsetHeight||window.innerHeight; }
  resize(); window.addEventListener('resize',resize);
  const pts=Array.from({length:50},()=>({x:Math.random()*W,y:H+Math.random()*H,vx:(Math.random()-0.5)*0.4,vy:-0.4-Math.random()*0.8,r:1+Math.random()*3,a:Math.random()*0.5+0.1}));
  (function anim(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(74,222,128,${p.a})`;ctx.fill();
    });
    if(!document.getElementById('welcome-splash').classList.contains('hide')) requestAnimationFrame(anim);
  })();
})();

function handleImagePick(e){
  const file=e.target.files?.[0]; if(!file) return;
  const mediaType=file.type||'image/jpeg';
  const reader=new FileReader();
  reader.onload=ev=>{
    const dataUrl=ev.target.result;
    pendingImage={base64:dataUrl.split(',')[1],mediaType,preview:dataUrl,name:file.name};
    document.getElementById('pending-thumb').src=dataUrl;
    document.getElementById('pending-name').textContent='📸 '+file.name;
    document.getElementById('pending-image-bar').style.display='block';
    document.getElementById('img-btn').classList.add('has-image');
    document.getElementById('chat-input').placeholder=T[lang].placeholderPhoto;
    updateSendBtn();
  };
  reader.readAsDataURL(file); e.target.value='';
}

function formatMsg(text){
  return text
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^#{1,3}\s(.+)$/gm,"<span class='msg-heading'>$1</span>")
    .replace(/^[-•]\s(.+)$/gm,"<span class='msg-bullet'>• $1</span>")
    .replace(/\n/g,'<br/>');
}

function appendMessage(role,content,imageData){
  const container=document.getElementById('messages');
  const wrap=document.createElement('div');
  wrap.className='message-wrap '+(role==='user'?'user-wrap':'ai-wrap');
  wrap.style.justifyContent=role==='user'?'flex-end':'flex-start';
  if(role==='assistant'){const av=document.createElement('div');av.className='avatar';av.textContent='🌾';wrap.appendChild(av);}
  const bubble=document.createElement('div');
  bubble.className=role==='user'?'user-bubble':'ai-bubble';
  if(role==='user'){
    if(imageData){const img=document.createElement('img');img.src=imageData.preview;img.className='msg-image';bubble.appendChild(img);}
    if(content){const t=document.createElement('div');t.textContent=content;bubble.appendChild(t);}
  }else{bubble.innerHTML=formatMsg(content);}
  wrap.appendChild(bubble);
  if(role==='user'){const av=document.createElement('div');av.className='avatar-user';av.textContent='👤';wrap.appendChild(av);}
  container.appendChild(wrap); container.scrollTop=container.scrollHeight;
  return bubble;
}

function buildApiHistory(){
  return messages.map(m=>{
    if(m.role==='user'&&m.image){
      return{role:'user',content:[
        {type:'text',text:m.content||(lang==='bn'?'এই ফসলের ছবিটি বিশ্লেষণ করুন।':'Please analyze this image of my crop.')},
        {type:'image_url',image_url:{url:`data:${m.image.mediaType};base64,${m.image.base64}`}}
      ]};
    }
    return{role:m.role,content:m.content};
  });
}

async function callAI(userMessage,image){
  const crop=document.getElementById('crop-select').value;
  const cropNote=crop?(lang==='bn'?`[কৃষকের প্রধান ফসল: ${crop}]\n\n`:`[Farmer's primary crop: ${crop}]\n\n`):'';
  const fallbackMsg=image?(lang==='bn'?'এই ফসলের ছবিটি বিশ্লেষণ করুন।':'Please analyze this image of my crop and tell me what you see.'):'';
  const text=cropNote+(userMessage||fallbackMsg);
  const history=buildApiHistory();
  const lastMsg=history[history.length-1];
  if(image){lastMsg.content=[{type:'text',text},{type:'image_url',image_url:{url:`data:${image.mediaType};base64,${image.base64}`}}];}
  else{lastMsg.content=text;}
  const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_API_KEY}`},
    body:JSON.stringify({
      model:image?'meta-llama/llama-4-scout-17b-16e-instruct':'llama-3.3-70b-versatile',
      max_tokens:1000,
      messages:[{role:'system',content:T[lang].systemPrompt},...history]
    })
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||`HTTP ${res.status}`);}
  const data=await res.json();
  return data.choices?.[0]?.message?.content||(lang==='bn'?'দুঃখিত, উত্তর পাওয়া যায়নি।':'Sorry, I could not get a response.');
}

async function sendMessage(textOverride){
  const inputEl=document.getElementById('chat-input');
  const msg=(textOverride!==undefined?textOverride:inputEl.value).trim();
  const image=pendingImage;
  if(!msg&&!image) return;
  if(loading) return;
  /* Flash send button */
  const btn=document.getElementById('send-btn');
  btn.classList.add('send-flash');
  setTimeout(()=>btn.classList.remove('send-flash'),400);

  loading=true;inputEl.value='';inputEl.style.height='';
  removePendingImage();updateSendBtn();showChat();
  messages.push({role:'user',content:msg||'',image:image||null});
  appendMessage('user',msg,image);appendTypingIndicator();
  try{
    const reply=await callAI(msg,image);
    removeTypingIndicator();
    messages.push({role:'assistant',content:reply});
    const container=document.getElementById('messages');
    const wrap=document.createElement('div');wrap.className='message-wrap ai-wrap';wrap.style.justifyContent='flex-start';
    const av=document.createElement('div');av.className='avatar';av.textContent='🌾';wrap.appendChild(av);
    const bubble=document.createElement('div');bubble.className='ai-bubble';
    wrap.appendChild(bubble);container.appendChild(wrap);container.scrollTop=container.scrollHeight;
    let i=0;
    const interval=setInterval(()=>{
      i++;
      bubble.innerHTML=formatMsg(reply.slice(0,i))+'<span class="cursor-blink">|</span>';
      container.scrollTop=container.scrollHeight;
      if(i>=reply.length){clearInterval(interval);bubble.innerHTML=formatMsg(reply);container.scrollTop=container.scrollHeight;loading=false;updateSendBtn();}
    },8);
  }catch(err){
    removeTypingIndicator();messages.pop();
    appendMessage('assistant',`⚠️ ${T[lang].errorMsg}`);
    loading=false;updateSendBtn();
  }
}

      document.getElementById('splash-loading-label').textContent='জ্ঞানভাণ্ডার লোড হচ্ছে…';
      document.getElementById('splash-btn-text').textContent='🚜 চাষ শুরু করুন';
      document.getElementById('splash-pill-text').textContent='AgriMind প্রস্তুত';
    }else{
      document.getElementById('splash-tagline').textContent='AI Farm Advisor';
      document.getElementById('splash-msg').innerHTML='Welcome! Your <strong>AI-powered agronomist</strong> is ready.<br>Ask anything — or upload a photo for instant diagnosis.';
      document.getElementById('splash-loading-label').textContent='Loading knowledge base…';
      document.getElementById('splash-btn-text').textContent='🚜 Start Farming Smarter';
      document.getElementById('splash-pill-text').textContent='AgriMind is ready';
    }
  }
  const _orig=window.setLang;
  window.setLang=function(l){_orig(l);updateSplashLang();};
  setTimeout(()=>dismissSplash(),4400);
})();

function dismissSplash(){
  const splash=document.getElementById('welcome-splash');
  if(!splash||splash.classList.contains('hide')) return;
  splash.classList.add('hide');
  setTimeout(()=>{splash.style.display='none';},800);
}

renderUI();
</script>
</body>
</html>
